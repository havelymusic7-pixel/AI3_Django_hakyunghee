{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="{% static 'todos/style.css' %}">
</head>
<body>
<main class="container form-container">
    <div class="form-card">
        <p class="eyebrow">Django Todo</p>
        <h1>{{ page_title }}</h1>

        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.non_field_errors }}

            <div class="field">
                <label for="{{ form.title.id_for_label }}">{{ form.title.label }}</label>
                {{ form.title }}
                {% for error in form.title.errors %}<p class="error">{{ error }}</p>{% endfor %}
            </div>

            <div class="field">
                <label for="{{ form.content.id_for_label }}">{{ form.content.label }}</label>
                {{ form.content }}
                {% for error in form.content.errors %}<p class="error">{{ error }}</p>{% endfor %}
            </div>

            <div class="form-actions">
                <a class="button" href="{% url 'todos:list' %}">취소</a>
                <button class="button primary" type="submit">저장</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
